[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "volleyball-pass-tracking-service"
version = "0.1.0"
description = "Сервис отслеживания траектории паса в волейболе по видеозаписи с задней линии (модель VballNet из fast-volleyball-tracking-inference)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Volleyball Tracking Team" },
]
keywords = ["volleyball", "ball-tracking", "pass-detection", "onnx", "computer-vision"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Video",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "numpy>=1.23",
    "opencv-python-headless>=4.8",
    "onnxruntime>=1.15",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
gpu = [
    "onnxruntime-gpu>=1.15",
]
dev = [
    "pytest>=7.0",
]

[project.scripts]
pass-tracker = "app.main:main"

[tool.setuptools]
packages = ["app", "config", "core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
